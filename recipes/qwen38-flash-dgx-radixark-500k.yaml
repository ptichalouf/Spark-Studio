# Recipe: qwen38-flash-dgx-radixark-500k
# Source de verite: docker inspect qwen38-flash (conteneur pilote ACC-297/309)
# Image qwen38-flash-dgx:v0.30 — parametres recopies a l'identique.
# Aucun alias "...-uncensored" : la variante uncensored reste sur .15 uniquement.
#
# Points critiques (ecart docker inspect -> sparkrun):
#   1. executor_config.entrypoint "" — l'image declare ENTRYPOINT ["vllm","serve"]
#      qui avale la commande sparkrun sinon.
#   2. -cc.splitting_ops=[...] en UN SEUL argument shell (guillemets simples) :
#      en docker CMD c'est un argv brut ; via bash il faut le proteger.

recipe_version: "2"
name: qwen38-flash-dgx-radixark-500k
description: >
  RadixArk/Qwen3.8-Flash-Next-NVFP4 (snapshot 7b719225) on qwen38-flash-dgx:v0.30 —
  nvfp4, YaRN 500k, MTP 2, tool-call-parser qwen3_coder, prefix-caching, PLE mmap.

runtime: vllm-distributed
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
container: qwen38-flash-dgx:v0.30

min_nodes: 1
max_nodes: 1
mods: []

executor_config:
  entrypoint: ""
  shm_size: 17179869184
  volumes:
    - /home/ptichalouf/.cache/huggingface/qwen38-flash-dgx/chat-templates/models--RadixArk--Qwen3.8-Flash-Next-NVFP4--7b719225242aacd3dbd3f9407468c2ee9a9d2594.jinja:/qwen38/chat_template.jinja:ro

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  max_model_len: 500000
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  gpu_memory_utilization: 0.92
  kv_cache_memory_bytes: 16106127360
  num_speculative_tokens: 2
  served_model_name: qwen3.8-flash-next
  kv_cache_dtype: auto

env:
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  HF_HUB_OFFLINE: "1"
  VLLM_PLE_MMAP: "1"
  VLLM_PLE_MMAP_WORKERS: "32"
  VLLM_PLE_MMAP_PREWARM: "0"
  VLLM_PLE_MMAP_MADVISE: "random"
  VLLM_PLE_MMAP_FAST_ROWS: "0"
  VLLM_QSA_DET_TOPK: "1"
  VLLM_QSA_EXACT_TOPK: "0"
  VLLM_QSA_DET_LIB: "/opt/llm/kernel-det/_C_det.so"
  VLLM_MTP_DRAFT_VOCAB: "/opt/llm/draft_vocab_65536.npy"
  MODE: "nvfp4"
  YARN: "1"

command: |
  vllm serve /cache/huggingface/hub/models--RadixArk--Qwen3.8-Flash-Next-NVFP4/snapshots/7b719225242aacd3dbd3f9407468c2ee9a9d2594 \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --load-format safetensors \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --enable-prompt-tokens-details \
    --enable-chunked-prefill \
    --max-num-batched-tokens {max_num_batched_tokens} \
    -cc.cudagraph_mode=PIECEWISE \
    '-cc.splitting_ops=["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::qwen4_exp_ple_short_conv","vllm::qwen4_exp_qsa_with_output","vllm::linear_attention","vllm::qwen_gdn_attention_core","vllm::qwen_gdn_attention_core_fused_norm_packed","vllm::gdn_attention_core_xpu","vllm::olmo_hybrid_gdn_full_forward","vllm::sparse_attn_indexer","vllm::rocm_aiter_sparse_attn_indexer","vllm::deepseek_v4_attention","vllm::hpc_rope_norm_forward","vllm::unified_kv_cache_update","vllm::unified_mla_kv_cache_update","vllm::ple_mmap_lookup_ids"]' \
    --no-enable-flashinfer-autotune \
    --kv-cache-dtype {kv_cache_dtype} \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
    '--hf-overrides={"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}' \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --chat-template /qwen38/chat_template.jinja \
    '--speculative-config={"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"max_model_len":{max_model_len}}'
